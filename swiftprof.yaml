# ============================================================================
#  swiftprof.yaml: готовые настройки обфускации (ready to obfuscate)
# ============================================================================
#
#  Как пользоваться:
#    1. Скопируйте этот файл в КОРЕНЬ вашего проекта под именем swiftprof.yaml.
#    2. Впишите пути к модулям (module) и имя Xcode-проекта (auto-spm).
#    3. Запустите из каталога SwiftProf:  ./obfuscate.sh /путь/к/проекту
#
#  Пути считаются ОТ КАТАЛОГА ЭТОГО ФАЙЛА, поэтому держите его в корне проекта.
# ============================================================================

# ---- ЗАПОЛНИТЬ -------------------------------------------------------------

# Записываемые таргеты, формат имя:путь. Их исходники будут ПЕРЕПИСАНЫ.
# Имя лучше делать совпадающим с именем модуля.
module:
  - App:./App/Sources/App
#  - Ext1:./App/Sources/Ext1
#  - Ext2:./App/Sources/Ext2

# SPM-пакеты проекта (только для чтения, файлы не переписываются). Впишите имя
# вашего Xcode-проекта. Нужен уже собранный проект (DerivedData); если папок
# DerivedData несколько, берётся самая свежая, поэтому соберите проект один раз
# перед обфускацией. Если SPM-пакетов в проекте нет, закомментируйте эту строку.
auto-spm: ИмяXcodeПроекта

# ---- ОПЦИОНАЛЬНО -----------------------------------------------------------

# Имена, которые нельзя переименовывать (завязаны на строки: Info.plist, сториборды,
# ключи Objective-C runtime). Дополните под свой проект.
#ignore-names:
#  - AppDelegate
#  - SceneDelegate

# ============================================================================
#  Ниже идут проверенные настройки. Обычно менять НЕ нужно.
# ============================================================================

# Виды имён, обфускация которых проверена и держит сборку зелёной: типы и вызываемые.
# property, enumCase и parameter пока не включены (их разрешение ещё не закрыто).
kinds:
  - class
  - struct
  - enum
  - protocol
  - typealias
  - associatedtype
  - method
  - function

# Отчёт решений Decisions.txt в каталоге вывода (по умолчанию ./out).
explain: true
