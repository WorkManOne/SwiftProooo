# ============================================================================
#  swiftprof.yaml — пример конфигурации SwiftProf (со всеми ключами)
# ============================================================================
#
#  Как пользоваться:
#    • Скопируйте этот файл рядом с проектом под именем `swiftprof.yaml`
#      (или `swiftprof.yml`) — он подхватится автоматически из текущей папки.
#      Либо укажите путь явно:  swiftprof --config путь/к/файлу.yaml
#    • Раскомментируйте (уберите `#`) те строки, которые вам нужны.
#      Всё закомментированное = значение по умолчанию, менять не обязательно.
#
#  Правила:
#    • Ключ = имя флага командной строки (kebab-case, без `--`).
#    • Флаги-списки (--ignore-names, --kinds, --sdk-modules ...) здесь — YAML-списки.
#    • Приоритет: флаг в командной строке ПЕРЕБИВАЕТ значение из этого файла,
#      файл перебивает встроенный дефолт.
#    • Относительные пути (./App, ./out ...) считаются ОТ ПАПКИ ЭТОГО ФАЙЛА,
#      так что запуск из любой директории через --config работает.
#    • Опечатка в ключе = ошибка запуска с подсказкой (молча не проигнорируется).
#
# ============================================================================
#  1. МОДУЛИ  (что обфусцировать)  — единственная обязательная секция
# ============================================================================

# Записываемые таргеты: их исходники будут ПЕРЕПИСАНЫ. Формат: имя:путь.
# Имя лучше делать совпадающим с реальным именем модуля Swift.
module:
  - App:./App
  # - Widget:./Widget
  # - SharedKit:./SharedKit

# Модули "только для чтения": из них берутся объявления (чтобы правильно
# переименовать использования), но сами файлы НЕ трогаются. Обычно это
# SPM-пакеты из DerivedData. Формат тот же — имя:путь.
# readonly:
#   - SomePackage:~/Library/Developer/Xcode/DerivedData/MyApp-abc/SourcePackages/checkouts/SomePackage

# ============================================================================
#  2. ВЫВОД
# ============================================================================

# Куда положить ConversionMap.json + CoverageReport.txt (и отчёты --explain).
# По умолчанию: ./out
# output: ./out

# Только отчёты, файлы НЕ переписывать. Удобно посмотреть, что будет сделано,
# ничего не меняя. По умолчанию: false
# dry-run: true

# Короткие читаемые имена (T0, m0, p0) вместо случайных 32-символьных токенов.
# ТОЛЬКО для инспекции/отладки — в бою оставляйте выключенным.
# По умолчанию: false
# debug-names: true

# ============================================================================
#  3. SDK / INTROSPECTION
# ============================================================================

# Имя SDK для интроспекции: iphonesimulator / iphoneos / macosx.
# По умолчанию: iphonesimulator
# sdk: iphonesimulator

# Явный путь к корню SDK (перебивает автопоиск через xcrun). Обычно не нужен.
# sdk-path: /Applications/Xcode.app/.../iPhoneSimulator.sdk

# Отключить разбор .swiftinterface из SDK (быстрее ~на 30 секунд, но SwiftProf
# меньше "знает" о протоколах фреймворков → чаще перестраховывается и меньше
# обфусцирует). По умолчанию интроспекция ВКЛЮЧЕНА (значит здесь false).
# no-sdk-introspect: true

# Дополнительные модули SDK для интроспекции СВЕРХ набора по умолчанию и
# автоопределённых импортов проекта. По умолчанию: пусто.
# sdk-modules:
#   - MapKit
#   - QuickLook

# ============================================================================
#  4. СПИСКИ ИСКЛЮЧЕНИЙ  (совместимы со SwiftShield)
# ============================================================================

# Имена, которые НИКОГДА не переименовывать. Пишите рядом ПОЧЕМУ — это ценно.
# По умолчанию: пусто.
# ignore-names:
#   - AppDelegate       # зарегистрирован в Info.plist
#   - SceneDelegate     # то же
#   - GADApplicationIdentifier

# Фрагменты путей: файл, путь которого содержит любой фрагмент, пропускается.
# По умолчанию: пусто.
# ignore-files:
#   - Generated/        # сгенерированный код
#   - .pb.swift         # protobuf

# Имена таргетов/модулей, которые не загружать вообще. По умолчанию: пусто.
# ignore-targets:
#   - LegacyKit

# ============================================================================
#  5. ПАКЕТЫ / DerivedData  (удобства для Xcode-проектов)
# ============================================================================

# Автоматически найти SPM-пакеты в DerivedData для указанного имени
# Xcode-проекта и добавить их как readonly-модули. По умолчанию: выключено.
# auto-spm: MyApp

# Переопределить корень DerivedData (по умолчанию ~/Library/Developer/Xcode/DerivedData).
# derived-data-path: /custom/DerivedData

# ============================================================================
#  6. РЕЖИМЫ / ЗЕЛЁНАЯ СБОРКА
# ============================================================================

# Отключить RollbackPass — оставить все переименования, даже если какие-то
# использования рассинхронизировались (быстрее, но сборка может покраснеть).
# Только для отладки. По умолчанию RollbackPass ВКЛЮЧЁН (значит здесь false).
# no-rollback: true

# Обфусцировать ТОЛЬКО перечисленные виды символов. Пусто = все виды.
# Помогает бисекцией найти, какой вид ломает сборку.
# Допустимо: class, struct, enum, protocol, typealias, associatedtype,
#            method, function, property, enumCase, parameter
# По умолчанию: пусто (все).
# kinds:
#   - class
#   - struct

# Обфускация raw-значений String-энумов: off / safe / all.
#   off  — не трогать (по умолчанию)
#   safe — только явные литералы, пропуская Codable
#   all  — каждый String-энум (материализует и неявные raw-значения)
# raw-values: off

# ============================================================================
#  7. РЫЧАГИ ПОД ПЕРЕГРУЖЕННЫЕ ФУНКЦИИ  (обычно НЕ нужны — включайте по факту)
# ============================================================================
#  Все они трейдят покрытие обфускации на гарантию зелёной сборки. Держите
#  выключенными, включайте точечно, если конкретная сборка краснеет.

# Заранее пропускать переименование любой функции/метода, у которой в проекте
# >1 одноимённого варианта. Полностью убирает риск рассинхрона перегрузок.
# По умолчанию: false
# skip-overloaded-callables: true

# Более агрессивная страховка RollbackPass для проектов с обилием перегрузок.
# По умолчанию: false
# aggressive-rollback: true

# ============================================================================
#  8. СЛОЙ ИНДЕКСА КОМПИЛЯТОРА  (опционально; точность на больших проектах)
# ============================================================================
#  Использует ground-truth компилятора (USR) для разрешения одноимённых
#  символов между таргетами и валидации переименований. Требует заранее
#  собранного индекса и Xcode на машине. САМ ПУТЬ = ВКЛЮЧАТЕЛЬ слоя: указали
#  путь — слой работает; не указали — обычный синтаксический режим.

# Путь к индексу (DataStore). Обычно это DerivedData вашего проекта.
# Fail-closed: отсутствующий/устаревший индекс — явная ошибка, а не догадки.
# index-store-path: ~/Library/Developer/Xcode/DerivedData/MyApp-abc/Index.noindex/DataStore

# Строгий гейт A5: пропускать переименование символов, у которых нет USR в
# индексе. По умолчанию ВЫКЛ — на реальных проектах индекс неполный, и гейт
# сильно роняет покрытие без выигрыша в безопасности. Только для отладки
# красной сборки или максимально-параноидального релиза. По умолчанию: false
# index-store-gate: true

# ============================================================================
#  9. ОТЧЁТНОСТЬ / ЛОГИ
# ============================================================================

# Отчёт по КАЖДОМУ символу (Decisions.txt + decisions.json в output): для
# каждого объявления — почему оно обфусцировано / защищено / пропущено /
# откачено. Полезно ответить "почему X не переименовался?". На больших
# проектах файл большой. По умолчанию: false
# explain: true

# Подробный лог в stderr. По умолчанию: false
# verbose: true
